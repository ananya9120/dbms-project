<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltGuard | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
        }
        .text-center { text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">VoltGuard</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <div class="container auth-container">
        <div class="glass-panel">
            <div class="text-center">
                <h2>Welcome Back</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Sign in to your account</p>
            </div>
            
            <div id="alertMsg" class="alert-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Login As</label>
                    <select id="loginRole" class="form-control" style="border: 1px solid var(--primary-color);">
                        <option value="user">Standard User</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                Don't have an account? <a href="register.html" style="color: var(--primary-color);">Register</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const res = await apiCall('/api/auth/login', 'POST', { email, password });
            if(res.error) {
                showAlert(res.error, 'error');
            } else {
                const selectedRole = document.getElementById('loginRole').value;
                if(res.user.role !== selectedRole) {
                    showAlert(`Access Denied: You do not have ${selectedRole} privileges.`, 'error');
                    return;
                }
                
                localStorage.setItem('token', res.token);
                localStorage.setItem('user', JSON.stringify(res.user));
                
                if(res.user.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
