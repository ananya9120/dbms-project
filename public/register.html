<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltGuard | Register</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 60px auto;
        }
        .text-center { text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">VoltGuard</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="container auth-container">
        <div class="glass-panel">
            <div class="text-center">
                <h2>Create Account</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Join the next-gen grid</p>
            </div>
            
            <div id="alertMsg" class="alert-message"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Register As</label>
                    <select id="role" class="form-control" style="border: 1px solid var(--primary-color);">
                        <option value="user">Standard User</option>
                        <option value="inspector">Inspector</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Area / Zone</label>
                    <select id="area" class="form-control" required>
                        <option value="North">North Zone</option>
                        <option value="South">South Zone</option>
                        <option value="East">East Zone</option>
                        <option value="West">West Zone</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Register</button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                Already have an account? <a href="login.html" style="color: var(--primary-color);">Login</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                address: document.getElementById('address').value,
                area: document.getElementById('area').value,
                role: document.getElementById('role').value,
            };
            
            const res = await apiCall('/api/auth/register', 'POST', data);
            if(res.error) {
                showAlert(res.error, 'error');
            } else {
                showAlert('Registration successful! Please login.', 'success');
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
    </script>
</body>
</html>
